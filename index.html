<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Focus One">
<meta name="theme-color" content="#FDF6EE">
<title>Focus One</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:#FDF6EE;color:#3D2C1E;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,button,select{font-family:'DM Sans',sans-serif}
button{-webkit-tap-highlight-color:transparent;cursor:pointer}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes celebratePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:none}
#import-input{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.02em;background:#e8e0d8;color:#5a4a3a}
.tag.imp-high{background:#FDEEE7;color:#C0462B}
.tag.imp-med{background:#FFF8E1;color:#B8860B}
.tag.imp-low{background:#E6F7F0;color:#01A66F}
.tag.proj{background:#EDE6F6;color:#6C3FA0}

.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sync-dot.connected{background:#01A66F}
.sync-dot.offline{background:#FECA57}
.sync-dot.disconnected{background:#ccc}
.sync-spinner{display:inline-block;width:14px;height:14px;border:2px solid #E8734A;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3D2C1E;color:#fff;padding:10px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9998;opacity:0;transition:opacity .3s ease;pointer-events:none}
.toast.show{opacity:1}

#lock-screen{position:fixed;inset:0;background:#FDF6EE;z-index:10000;display:flex;align-items:center;justify-content:center}
#lock-screen .lock-box{text-align:center;max-width:340px;width:90%;animation:scaleIn .4s ease}
#lock-screen h1{font-family:'Fraunces',serif;font-size:36px;font-weight:800;color:#E8734A;margin-bottom:4px}
#lock-screen .subtitle{color:#9A8778;font-size:15px;margin-bottom:32px}
#lock-screen form{background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 16px rgba(60,40,20,.07);text-align:left;display:flex;flex-direction:column;gap:14px}
#lock-screen label{font-size:12px;font-weight:700;color:#9A8778;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
#lock-screen input[type=text],#lock-screen input[type=password],#lock-screen input[type=url]{width:100%;padding:13px 14px;border:2px solid #EDE4DA;border-radius:12px;font-size:16px;outline:none;transition:border .2s;background:#fff;color:#3D2C1E}
#lock-screen input:focus{border-color:#E8734A}
#lock-screen .remember{display:flex;align-items:center;gap:8px;font-size:14px;color:#5a4a3a}
#lock-screen .remember input{width:18px;height:18px;accent-color:#E8734A}
#lock-screen .signin{border:none;font-weight:700;border-radius:14px;padding:15px;font-size:16px;background:linear-gradient(135deg,#E8734A,#D4563A);color:#fff;box-shadow:0 4px 18px rgba(232,115,74,.3)}
#lock-screen .signin:disabled{opacity:.6}
#lock-screen .lock-hint{color:#9A8778;font-size:13px;min-height:18px;text-align:center}
#lock-screen .lock-hint.error{color:#C0462B}
#lock-screen .url-toggle{background:none;border:none;color:#9A8778;font-size:12px;text-decoration:underline;padding:0;align-self:flex-start}
</style>
</head>
<body>
<div id="lock-screen">
  <div class="lock-box">
    <h1>Focus One</h1>
    <p class="subtitle">One task at a time. You've got this.</p>
    <form id="login-form" autocomplete="on">
      <div>
        <label for="login-user">Username</label>
        <input type="text" id="login-user" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div>
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
      </div>
      <div id="url-field">
        <label for="login-url">Apps Script URL</label>
        <input type="url" id="login-url" placeholder="https://script.google.com/macros/s/..." autocomplete="off" autocapitalize="none" spellcheck="false">
      </div>
      <button type="button" class="url-toggle" id="url-toggle" hidden>Change Apps Script URL</button>
      <label class="remember" style="text-transform:none;letter-spacing:0;font-weight:500;margin:0">
        <input type="checkbox" id="login-remember" checked> Keep me signed in on this device
      </label>
      <button type="submit" class="signin" id="login-btn">Sign in</button>
      <p class="lock-hint" id="lock-hint"></p>
    </form>
  </div>
</div>
<canvas id="confetti-canvas"></canvas>
<input type="file" id="import-input" accept=".json">
<div id="toast" class="toast"></div>
<div id="app" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 80px;max-width:520px;margin:0 auto;display:none"></div>

<script>
// ============================================================
// AUTH + ENCRYPTION
// Nothing secret lives in this file. The Apps Script checks the
// username/password on Google's servers, and the copy of your tasks
// saved in this browser is encrypted with a key made from your password.
// ============================================================
const URL_KEY = 'focusone_script_url';
const REMEMBER_KEY = 'focusone_auth';
const ENC_KEY = 'focusone_tasks_enc';
const SALT_KEY = 'focusone_salt';
let AUTH = null;        // {username, password} — in memory only, unless "keep me signed in"
let CRYPTO_KEY = null;  // AES key derived from the password

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function getSalt(){
  let s = lsGet(SALT_KEY);
  if(!s){ s = b64(crypto.getRandomValues(new Uint8Array(16))); lsSet(SALT_KEY, s); }
  return unb64(s);
}

async function deriveKey(username, password){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(username + '\u0000' + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:getSalt(), iterations:250000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

async function encryptToStorage(plain){
  if(!CRYPTO_KEY) return;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, CRYPTO_KEY, new TextEncoder().encode(plain));
  lsSet(ENC_KEY, JSON.stringify({iv:b64(iv), ct:b64(ct)}));
}

async function decryptFromStorage(key){
  const raw = lsGet(ENC_KEY);
  if(!raw) throw new Error('no cache');
  const {iv, ct} = JSON.parse(raw);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, key, unb64(ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function apiCall(url, action, payload){
  const resp = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'text/plain'}, // Apps Script needs this for CORS
    body: JSON.stringify({action, ...(payload||{}), username:AUTH?.username, password:AUTH?.password}),
  });
  const result = await resp.json();
  if(result && result.auth) { signOut('Your login changed. Please sign in again.'); throw new Error('auth'); }
  return result;
}

async function signIn(username, password, url, remember){
  const key = await deriveKey(username, password);
  let result = null;
  try {
    const resp = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({action:'login', username, password})});
    result = await resp.json();
  } catch(e) { result = null; }

  if (result) {
    if (!result.success) throw new Error(result.error || 'Sign-in failed.');
    AUTH = {username, password}; CRYPTO_KEY = key;
    tasks = Array.isArray(result.tasks) ? result.tasks : [];
    syncStatus = 'connected'; lastSyncError = '';
    saveLocal();
    lsDel('focusone_tasks'); lsDel('focusone_pin_hash'); // remove old unencrypted data
  } else {
    // Can't reach Google — open the encrypted copy on this device instead.
    try { tasks = await decryptFromStorage(key); }
    catch(e) { throw new Error("Can't reach Google Sheets, and there's no saved copy on this device for that login."); }
    AUTH = {username, password}; CRYPTO_KEY = key;
    syncStatus = 'offline'; lastSyncError = 'Working offline';
  }

  lsSet(URL_KEY, url);
  if (remember) lsSet(REMEMBER_KEY, JSON.stringify({username, password}));
  else lsDel(REMEMBER_KEY);

  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  view = 'list'; render();
}

function signOut(msg){
  lsDel(REMEMBER_KEY);
  AUTH = null; CRYPTO_KEY = null; tasks = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('app').innerHTML = '';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  setupLoginForm(msg || '', !!msg);
}

function setupLoginForm(msg, isError){
  const savedUrl = lsGet(URL_KEY) || '';
  const urlField = document.getElementById('url-field');
  const toggle = document.getElementById('url-toggle');
  document.getElementById('login-url').value = savedUrl;
  urlField.hidden = !!savedUrl;
  toggle.hidden = !savedUrl;
  const hint = document.getElementById('lock-hint');
  hint.textContent = msg || '';
  hint.className = 'lock-hint' + (isError ? ' error' : '');
}

document.getElementById('url-toggle').addEventListener('click', () => {
  document.getElementById('url-field').hidden = false;
  document.getElementById('url-toggle').hidden = true;
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const url = document.getElementById('login-url').value.trim();
  const remember = document.getElementById('login-remember').checked;
  const hint = document.getElementById('lock-hint');
  const btn = document.getElementById('login-btn');
  if (!url.startsWith('https://script.google.com/')) {
    document.getElementById('url-field').hidden = false;
    hint.textContent = 'Enter your Apps Script URL (starts with https://script.google.com/).';
    hint.className = 'lock-hint error'; return;
  }
  btn.disabled = true; btn.textContent = 'Signing in…';
  hint.textContent = ''; hint.className = 'lock-hint';
  try { await signIn(u, p, url, remember); }
  catch(err) { hint.textContent = err.message; hint.className = 'lock-hint error'; }
  btn.disabled = false; btn.textContent = 'Sign in';
});

// ============================================================
// STATE
// ============================================================
let tasks = [];
let view = 'list';
let focusTask = null;
let skipped = [];
let justDone = false;
let fText='', fLoc='', fImp=null, fDur=null, fProj='';
let focusProject = null; // null = show picker, '' = all, 'Name' = specific
let newProjMode = false;
let newProjText = '';
let syncStatus = 'disconnected'; // connected | syncing | offline | disconnected
let lastSyncError = '';

const LOCS = ['Home','Work','Office','Outside','Errands','Computer','Phone','Anywhere'];
const IMP = [{l:'Low',v:1,e:'🌱'},{l:'Medium',v:2,e:'⚡'},{l:'High',v:3,e:'🔥'}];
const DUR = [{l:'< 5 min',v:5,e:'⏱'},{l:'5–15 min',v:15,e:'🕐'},{l:'15–30 min',v:30,e:'🕑'},{l:'30–60 min',v:60,e:'🕒'},{l:'1+ hours',v:90,e:'🕓'}];

function getProjects(){
  const set=new Set();
  tasks.forEach(t=>{if(t.project)set.add(t.project)});
  return [...set].sort((a,b)=>a.localeCompare(b));
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// LOCAL PERSISTENCE (encrypted cache in this browser)
// ============================================================
let saveChain = Promise.resolve();
function saveLocal(){
  const data = JSON.stringify(tasks);
  saveChain = saveChain.then(() => encryptToStorage(data)).catch(() => {});
}

// ============================================================
// GOOGLE SHEETS SYNC (every request carries your login)
// ============================================================
function getScriptUrl() { return lsGet(URL_KEY) || ''; }
function isConnected() { return !!getScriptUrl() && !!AUTH; }

async function sheetFetch(tasks_data) {
  if (!isConnected()) return null;
  syncStatus = 'syncing'; render();
  try {
    const result = await apiCall(getScriptUrl(), 'sync', { tasks: tasks_data });
    if (result.success) { syncStatus = 'connected'; lastSyncError = ''; }
    else { syncStatus = 'offline'; lastSyncError = result.error || 'Unknown error'; }
  } catch (err) {
    if (err.message === 'auth') return;
    syncStatus = 'offline'; lastSyncError = err.message;
  }
  render();
}

async function sheetPost(action, payload) {
  if (!isConnected()) return null;
  try {
    const result = await apiCall(getScriptUrl(), action, payload);
    if (result.success && syncStatus === 'offline') { syncStatus = 'connected'; lastSyncError = ''; render(); }
    return result;
  } catch (err) {
    if (err.message === 'auth') return null;
    syncStatus = 'offline'; lastSyncError = err.message; render();
    return null;
  }
}

async function pullFromSheet() {
  if (!isConnected()) return;
  syncStatus = 'syncing'; render();
  try {
    const result = await apiCall(getScriptUrl(), 'list');
    if (result.success && Array.isArray(result.tasks)) {
      tasks = result.tasks;
      saveLocal();
      syncStatus = 'connected'; lastSyncError = '';
      toast('Synced from Google Sheets');
    } else {
      syncStatus = 'offline'; lastSyncError = result.error || 'Failed to pull';
    }
  } catch (err) {
    if (err.message === 'auth') return;
    syncStatus = 'offline'; lastSyncError = err.message;
  }
  render();
}

async function pushToSheet() {
  await sheetFetch(tasks);
  if (syncStatus === 'connected') toast('Pushed to Google Sheets');
}

// ============================================================
// EXPORT / IMPORT (JSON file backup — still works)
// ============================================================
function exportTasks(){
  const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  const d=new Date();a.download=`focus-one-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function triggerImport(){document.getElementById('import-input').click()}
document.getElementById('import-input').addEventListener('change',function(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const imp=JSON.parse(ev.target.result);
      if(!Array.isArray(imp)){alert('Invalid file format.');return}
      const ids=new Set(tasks.map(t=>t.id));let added=0;
      imp.forEach(t=>{if(!ids.has(t.id)&&t.text){tasks.push(t);added++}});
      if(added===0&&confirm(`All ${imp.length} tasks already exist. Replace entire list with this backup?`))tasks=imp;
      saveLocal();
      if(isConnected()) pushToSheet();
      view='list';render();
      if(added>0)toast(`Imported ${added} new task${added>1?'s':''}!`);
    }catch(err){alert("Could not read file. Make sure it's a valid Focus One backup.")}
  };reader.readAsText(file);e.target.value='';
});

// ============================================================
// WEIGHTED PICK
// ============================================================
function pick(skipIds=[],projFilter=null){
  let avail=tasks.filter(t=>!t.done&&!skipIds.includes(t.id));
  if(projFilter==='__none__')avail=avail.filter(t=>!t.project);
  else if(projFilter)avail=avail.filter(t=>t.project===projFilter);
  if(!avail.length)return null;
  const now=Date.now();
  const w=avail.map(t=>{const age=(now-t.createdAt)/864e5;return(1+age*.5)*(t.importance||1)});
  const total=w.reduce((s,x)=>s+x,0);let r=Math.random()*total;
  for(let i=0;i<avail.length;i++){r-=w[i];if(r<=0)return avail[i]}
  return avail[avail.length-1];
}

// ============================================================
// CONFETTI
// ============================================================
function boom(){
  const c=document.getElementById('confetti-canvas');c.style.display='block';
  const ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#5F27CD','#01A66F','#FF6348'];
  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:Math.random()*c.height*-1.5,
    w:Math.random()*10+5,h:Math.random()*6+4,col:cols[Math.floor(Math.random()*cols.length)],
    sh:['r','c','t'][Math.floor(Math.random()*3)],vx:(Math.random()-.5)*6,vy:Math.random()*4+3,
    rot:Math.random()*360,rs:(Math.random()-.5)*12,op:1}));
  let f=0;
  (function draw(){ctx.clearRect(0,0,c.width,c.height);f++;let alive=false;
    ps.forEach(p=>{p.x+=p.vx;p.vy+=.12;p.y+=p.vy;p.rot+=p.rs;
      if(f>108)p.op-=.02;if(p.op<0)p.op=0;if(p.op>0)alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.globalAlpha=p.op;ctx.fillStyle=p.col;
      if(p.sh==='r')ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      else if(p.sh==='c'){ctx.beginPath();ctx.arc(0,0,p.w/2,0,Math.PI*2);ctx.fill()}
      else{ctx.beginPath();ctx.moveTo(0,-p.w/2);ctx.lineTo(p.w/2,p.h/2);ctx.lineTo(-p.w/2,p.h/2);ctx.closePath();ctx.fill()}
      ctx.restore()});
    if(!alive||f>180){ctx.clearRect(0,0,c.width,c.height);c.style.display='none';return}
    requestAnimationFrame(draw)})();
}

// ============================================================
// ACTIONS
// ============================================================
function nav(v){view=v;justDone=false;if(v!=='focus'){focusProject=null}render()}
function enterFocus(){skipped=[];justDone=false;focusProject=null;view='focus';render()}
function pickFromProject(proj){focusProject=proj||'';skipped=[];focusTask=pick([],proj||null);render()}

function skipIt(){skipped.push(focusTask?.id);const pf=focusProject||null;let n=pick(skipped,pf);if(!n){n=pick([],pf);skipped=[]}focusTask=n;render()}

function completeIt(){
  if(!focusTask)return;
  tasks=tasks.map(t=>t.id===focusTask.id?{...t,done:true}:t);
  saveLocal();
  if(isConnected()) sheetPost('update',{task:{...focusTask,done:true}});
  justDone=true;boom();render();
}

function del(id){
  tasks=tasks.filter(t=>t.id!==id);
  saveLocal();
  if(isConnected()) sheetPost('delete',{id});
  render();
}

function clearDone(){
  if(confirm('Remove all completed tasks?')){
    const doneIds=tasks.filter(t=>t.done).map(t=>t.id);
    tasks=tasks.filter(t=>!t.done);
    saveLocal();
    if(isConnected()) pushToSheet(); // full sync is simplest for bulk delete
    render();
  }
}

function addTask(){
  if(!fText.trim())return;
  const newTask = {
    id:Date.now()+'-'+Math.random().toString(36).slice(2,9),
    text:fText.trim(),location:fLoc||null,importance:fImp,duration:fDur,project:fProj||null,done:false,createdAt:Date.now(),
  };
  tasks.push(newTask);
  saveLocal();
  if(isConnected()) sheetPost('add',{task:newTask});
  fText='';fLoc='';fImp=null;fDur=null;fProj='';newProjMode=false;newProjText='';view='list';render();
}

// ============================================================
// HELPERS
// ============================================================
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function impI(v){return IMP.find(i=>i.v===v)}
function durI(v){return DUR.find(d=>d.v===v)}
function impCls(v){return v===3?'imp-high':v===2?'imp-med':v===1?'imp-low':''}
function tag(txt,cls){return `<span class="tag ${cls||''}">${txt}</span>`}
function tagsFor(t){let h='';
  if(t.project)h+=tag('📂 '+esc(t.project),'proj');
  if(t.location)h+=tag('📍 '+esc(t.location));
  if(t.importance){const i=impI(t.importance);h+=tag(i.e+' '+i.l,impCls(t.importance))}
  if(t.duration){const d=durI(t.duration);h+=tag(d.e+' '+d.l)}
  return h;
}

const B='border:none;font-weight:700;border-radius:14px;cursor:pointer;transition:all .18s ease;';
const accent='#E8734A',green='#01A66F';

// ============================================================
// RENDER
// ============================================================
function render(){
  if(!AUTH) return;
  const app=document.getElementById('app');
  const inc=tasks.filter(t=>!t.done), done=tasks.filter(t=>t.done);
  let h='';

  // Header
  h+=`<div style="text-align:center;margin-bottom:24px;animation:fadeUp .5s ease">
    <h1 style="font-family:'Fraunces',serif;font-size:36px;font-weight:800;color:${accent};letter-spacing:-.02em;margin-bottom:4px">Focus One</h1>
    <p style="color:#9A8778;font-size:15px;font-weight:500">One task at a time. You've got this.</p>`;

  // Sync status indicator
  if (isConnected()) {
    const dotClass = syncStatus === 'syncing' ? '' : (syncStatus === 'offline' ? 'offline' : 'connected');
    const label = syncStatus === 'syncing' ? 'Syncing...' : (syncStatus === 'offline' ? 'Offline (local)' : 'Google Sheets ✓');
    h += `<div style="margin-top:8px;font-size:12px;color:#9A8778;font-weight:600;display:flex;align-items:center;justify-content:center">`;
    if (syncStatus === 'syncing') {
      h += `<span class="sync-spinner"></span>`;
    } else {
      h += `<span class="sync-dot ${dotClass}"></span>`;
    }
    h += `${label}</div>`;
  }
  h += `</div>`;

  // Nav
  h+=`<div style="display:flex;gap:8px;margin-bottom:28px;animation:fadeUp .5s ease .05s both">`;
  [{k:'list',l:'📋 My Tasks'},{k:'add',l:'✏️ Add Task'},{k:'settings',l:'⚙️'}].forEach(t=>{
    const a=view===t.k;
    h+=`<button onclick="nav('${t.k}')" style="${B}padding:10px 20px;font-size:14px;
      background:${a?accent:'#fff'};color:${a?'#fff':'#3D2C1E'};
      box-shadow:${a?'0 4px 14px rgba(232,115,74,.3)':'0 2px 16px rgba(60,40,20,.07)'}">${t.l}</button>`;
  });
  h+=`</div><div style="width:100%">`;

  // ====== LIST VIEW ======
  if(view==='list'){
    h+=`<div style="animation:fadeUp .4s ease">`;
    if(inc.length>0)h+=`<button onclick="enterFocus()" style="${B}width:100%;padding:18px 24px;font-size:18px;
      background:linear-gradient(135deg,${accent},#D4563A);color:#fff;box-shadow:0 6px 24px rgba(232,115,74,.35);
      margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:10px">
      <span style="font-size:24px">🎯</span> Pick a task for me!</button>`;
    if(inc.length===0)h+=`<div style="text-align:center;padding:40px;color:#9A8778;animation:scaleIn .4s ease">
      <div style="font-size:48px;margin-bottom:12px">🌿</div>
      <h3 style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:8px;color:#3D2C1E">All clear!</h3>
      <p style="font-size:14px">Add a task to get started.</p></div>`;
    inc.forEach((t,i)=>{
      h+=`<div style="background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:10px;
        box-shadow:0 2px 16px rgba(60,40,20,.07);display:flex;align-items:flex-start;gap:12px;
        animation:fadeUp .35s ease ${i*.04}s both">
        <div style="flex:1"><p style="font-size:15px;font-weight:600;margin-bottom:6px">${esc(t.text)}</p>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${tagsFor(t)}</div></div>
        <button onclick="del('${t.id}')" title="Delete" style="${B}background:transparent;color:#9A8778;
          font-size:18px;padding:4px 8px;line-height:1">×</button></div>`;
    });
    if(done.length>0){
      h+=`<details style="margin-top:24px"><summary style="cursor:pointer;color:#9A8778;font-size:13px;
        font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px">Completed (${done.length})</summary>`;
      done.forEach(t=>{h+=`<div style="background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:6px;
        opacity:.55;display:flex;align-items:center;gap:10px">
        <span style="color:${green};font-size:18px">✓</span>
        <span style="text-decoration:line-through;font-size:14px;flex:1">${esc(t.text)}</span>
        <button onclick="del('${t.id}')" style="${B}background:transparent;color:#9A8778;font-size:16px;padding:2px 6px">×</button></div>`});
      h+=`<button onclick="clearDone()" style="${B}background:transparent;color:#C0462B;font-size:12px;
        margin-top:8px;padding:6px 0;text-decoration:underline">Clear all completed</button></details>`;
    }
    h+=`</div>`;
  }

  // ====== ADD VIEW ======
  if(view==='add'){
    const lbl='font-size:12px;font-weight:700;color:#9A8778;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px';
    h+=`<div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 16px rgba(60,40,20,.07);animation:scaleIn .35s ease">
      <h2 style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin-bottom:20px">New Task</h2>
      <label style="${lbl}">What do you need to do?</label>
      <input type="text" id="task-input" placeholder="e.g. Take out the recycling" value="${esc(fText)}"
        oninput="fText=this.value" onkeydown="if(event.key==='Enter')addTask()"
        style="width:100%;padding:14px 16px;border:2px solid #EDE4DA;border-radius:12px;font-size:16px;
        outline:none;transition:border .2s;margin-bottom:20px"
        onfocus="this.style.borderColor='${accent}'" onblur="this.style.borderColor='#EDE4DA'">
      <label style="${lbl}">Project <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:${newProjMode?'10':'20'}px">`;
    const projs=getProjects();
    projs.forEach(p=>{const a=fProj===p;
      h+=`<button onclick="fProj=fProj==='${esc(p)}'?'':'${esc(p)}';newProjMode=false;render();fi()" style="${B}padding:7px 14px;font-size:13px;
        background:${a?'#6C3FA0':'#EDE6F6'};color:${a?'#fff':'#6C3FA0'}">📂 ${esc(p)}</button>`});
    if(!newProjMode){
      h+=`<button onclick="newProjMode=true;newProjText='';fProj='';render()" style="${B}padding:7px 14px;font-size:13px;
        background:#EDE6F6;color:#6C3FA0;border:1.5px dashed #C4B0DD">+ New</button>`;
    }
    h+=`</div>`;
    if(newProjMode){
      h+=`<div style="display:flex;gap:8px;margin-bottom:20px">
        <input type="text" id="new-proj-input" placeholder="Project name" value="${esc(newProjText)}"
          oninput="newProjText=this.value;fProj=this.value"
          onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('task-input').focus()}"
          style="flex:1;padding:10px 14px;border:2px solid #C4B0DD;border-radius:10px;font-size:14px;outline:none"
          onfocus="this.style.borderColor='#6C3FA0'" onblur="this.style.borderColor='#C4B0DD'">
        <button onclick="newProjMode=false;fProj='';render();fi()" style="${B}padding:10px 14px;font-size:13px;
          background:transparent;color:#9A8778">Cancel</button></div>`;
      setTimeout(()=>{const np=document.getElementById('new-proj-input');if(np)np.focus()},20);
    }
    h+=`<label style="${lbl}">Where? <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px">`;
    LOCS.forEach(loc=>{const a=fLoc===loc;
      h+=`<button onclick="fLoc=fLoc==='${loc}'?'':'${loc}';render();fi()" style="${B}padding:7px 14px;font-size:13px;
        background:${a?accent:'#FDEEE7'};color:${a?'#fff':accent}">${loc}</button>`});
    h+=`</div><label style="${lbl}">Importance <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <div style="display:flex;gap:8px;margin-bottom:20px">`;
    IMP.forEach(im=>{const a=fImp===im.v;
      h+=`<button onclick="fImp=fImp===${im.v}?null:${im.v};render();fi()" style="${B}flex:1;padding:10px 8px;font-size:14px;
        background:${a?accent:'#FDEEE7'};color:${a?'#fff':accent}">${im.e} ${im.l}</button>`});
    h+=`</div><label style="${lbl}">How long will it take?</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px">`;
    DUR.forEach(d=>{const a=fDur===d.v;
      h+=`<button onclick="fDur=fDur===${d.v}?null:${d.v};render();fi()" style="${B}padding:8px 14px;font-size:13px;
        background:${a?accent:'#FDEEE7'};color:${a?'#fff':accent}">${d.e} ${d.l}</button>`});
    const ok=fText.trim().length>0;
    h+=`</div><button onclick="addTask()" style="${B}width:100%;padding:16px;font-size:16px;
      background:${ok?'linear-gradient(135deg,'+accent+',#D4563A)':'#EDE4DA'};
      color:${ok?'#fff':'#9A8778'};box-shadow:${ok?'0 4px 18px rgba(232,115,74,.3)':'none'};
      cursor:${ok?'pointer':'default'}">Add Task</button></div>`;
  }

  // ====== FOCUS VIEW ======
  if(view==='focus'){
    h+=`<div style="animation:scaleIn .4s ease;text-align:center">`;
    if(justDone){
      const rem=tasks.filter(t=>!t.done).length;
      h+=`<div style="animation:celebratePulse .6s ease 2">
        <div style="font-size:64px;margin-bottom:16px">🎉</div>
        <h2 style="font-family:'Fraunces',serif;font-size:28px;font-weight:800;color:${green};margin-bottom:8px">Nice work!</h2>
        <p style="color:#9A8778;font-size:15px;margin-bottom:28px">You crushed it. One less thing to worry about.</p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button onclick="nav('list')" style="${B}padding:14px 28px;font-size:15px;background:#fff;color:#3D2C1E;
            box-shadow:0 2px 16px rgba(60,40,20,.07)">Back to List</button>
          ${rem>0?`<button onclick="enterFocus()" style="${B}padding:14px 28px;font-size:15px;
            background:linear-gradient(135deg,${accent},#D4563A);color:#fff;
            box-shadow:0 4px 18px rgba(232,115,74,.3)">🎯 Another one!</button>`:''}</div></div>`;
    }else if(focusProject===null){
      // Project picker step
      const projs=getProjects();
      const inc2=tasks.filter(t=>!t.done);
      if(inc2.length===0){
        h+=`<div style="font-size:48px;margin-bottom:12px">🌿</div>
          <p style="color:#9A8778">No tasks available. Add some first!</p>
          <button onclick="nav('add')" style="${B}margin-top:16px;padding:12px 24px;font-size:14px;
            background:${accent};color:#fff">Add a Task</button>`;
      } else {
        h+=`<p style="font-size:13px;font-weight:700;color:#9A8778;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px">Pick from which project?</p>`;
        // "All tasks" button
        const allCount=inc2.length;
        h+=`<button onclick="pickFromProject('')" style="${B}width:100%;padding:16px 20px;font-size:16px;
          background:linear-gradient(135deg,${accent},#D4563A);color:#fff;box-shadow:0 4px 18px rgba(232,115,74,.3);
          margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px">
          <span style="font-size:20px">🎲</span> All tasks <span style="opacity:.7;font-size:13px">(${allCount})</span></button>`;
        // Per-project buttons
        projs.forEach(p=>{
          const ct=inc2.filter(t=>t.project===p).length;
          if(ct>0)h+=`<button onclick="pickFromProject('${esc(p)}')" style="${B}width:100%;padding:14px 20px;font-size:15px;
            background:#fff;color:#3D2C1E;box-shadow:0 2px 16px rgba(60,40,20,.07);margin-bottom:8px;
            display:flex;align-items:center;gap:10px;text-align:left">
            <span style="font-size:18px">📂</span> <span style="flex:1">${esc(p)}</span>
            <span style="color:#9A8778;font-size:13px">${ct}</span></button>`;
        });
        // Unassigned tasks
        const noProj=inc2.filter(t=>!t.project).length;
        if(noProj>0 && projs.length>0)h+=`<button onclick="pickFromProject('__none__')" style="${B}width:100%;padding:14px 20px;font-size:15px;
          background:#fff;color:#3D2C1E;box-shadow:0 2px 16px rgba(60,40,20,.07);margin-bottom:8px;
          display:flex;align-items:center;gap:10px;text-align:left">
          <span style="font-size:18px">📋</span> <span style="flex:1;color:#9A8778">No project</span>
          <span style="color:#9A8778;font-size:13px">${noProj}</span></button>`;
        h+=`<button onclick="nav('list')" style="${B}margin-top:12px;padding:10px 20px;font-size:13px;
          background:transparent;color:#9A8778">← Back to list</button>`;
      }
    }else if(focusTask){
      const projLabel=focusProject==='__none__'?'No project':(focusProject||'All tasks');
      h+=`<p style="font-size:13px;font-weight:700;color:#9A8778;text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px">
        Your one thing right now${focusProject?` · ${esc(projLabel)}`:''}:</p>
        <div style="background:#fff;border-radius:24px;padding:36px 28px;box-shadow:0 8px 36px rgba(60,40,20,.1);margin-bottom:28px;animation:wiggle .4s ease">
          <h2 style="font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin-bottom:16px;line-height:1.3">${esc(focusTask.text)}</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">${tagsFor(focusTask)}</div></div>
        <div style="display:flex;gap:10px;justify-content:center">
          <button onclick="skipIt()" style="${B}padding:14px 28px;font-size:15px;background:#fff;color:#9A8778;
            box-shadow:0 2px 16px rgba(60,40,20,.07)">Skip →</button>
          <button onclick="completeIt()" style="${B}padding:14px 28px;font-size:15px;
            background:linear-gradient(135deg,${green},#018A5C);color:#fff;
            box-shadow:0 4px 18px rgba(1,166,111,.3)">✓ Done!</button></div>
        <button onclick="nav('list')" style="${B}margin-top:16px;padding:10px 20px;font-size:13px;
          background:transparent;color:#9A8778">← Back to list</button>`;
    }else{
      h+=`<div style="font-size:48px;margin-bottom:12px">🌿</div>
        <p style="color:#9A8778">No tasks available${focusProject?' in this project':''}. Add some first!</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
          <button onclick="enterFocus()" style="${B}padding:12px 24px;font-size:14px;
            background:#fff;color:#3D2C1E;box-shadow:0 2px 16px rgba(60,40,20,.07)">Try another project</button>
          <button onclick="nav('add')" style="${B}padding:12px 24px;font-size:14px;
            background:${accent};color:#fff">Add a Task</button></div>`;
    }
    h+=`</div>`;
  }

  // ====== SETTINGS VIEW ======
  if(view==='settings'){
    const tc=tasks.length, dc=tasks.filter(t=>t.done).length;

    h+=`<div style="background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 16px rgba(60,40,20,.07);animation:scaleIn .35s ease">
      <h2 style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin-bottom:4px">Settings</h2>
      <p style="color:#9A8778;font-size:14px;margin-bottom:24px">
        ${tc} task${tc!==1?'s':''} · ${dc} completed</p>

      <!-- Google Sheets Connection -->
      <div style="border:2px solid #EDE4DA;border-radius:16px;padding:20px;margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">📊</span> Google Sheets Sync
        </h3>
        <p style="color:#9A8778;font-size:13px;margin-bottom:16px">
          Your tasks are saved to your Google Sheet.
        </p>`;

    {
      const statusColor = syncStatus === 'connected' ? green : (syncStatus === 'offline' ? '#FECA57' : '#ccc');
      const statusText = syncStatus === 'connected' ? 'Connected' : (syncStatus === 'offline' ? 'Connection issue' : 'Syncing...');
      h += `
        <div style="background:#E6F7F0;border-radius:12px;padding:12px 16px;margin-bottom:12px;
          display:flex;align-items:center;gap:8px">
          <span class="sync-dot" style="background:${statusColor}"></span>
          <span style="font-size:13px;font-weight:600;color:${green}">${statusText}</span>
        </div>
        ${lastSyncError ? `<p style="color:#C0462B;font-size:12px;margin-bottom:12px">⚠ ${esc(lastSyncError)}</p>` : ''}
        <div style="display:flex;gap:8px">
          <button onclick="pullFromSheet()" style="${B}flex:1;padding:12px;font-size:13px;
            background:#FDEEE7;color:${accent}">↓ Pull from Sheet</button>
          <button onclick="pushToSheet()" style="${B}flex:1;padding:12px;font-size:13px;
            background:#FDEEE7;color:${accent}">↑ Push to Sheet</button>
        </div>`;
    }

    h += `</div>

      <!-- JSON Export/Import -->
      <div style="border:2px solid #EDE4DA;border-radius:16px;padding:20px;margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">💾</span> File Backup
        </h3>
        <p style="color:#9A8778;font-size:13px;margin-bottom:16px">
          Export or import a JSON backup file.
        </p>
        <div style="display:flex;gap:8px">
          <button onclick="exportTasks()" style="${B}flex:1;padding:12px;font-size:13px;
            background:#FDEEE7;color:${accent}">📤 Export</button>
          <button onclick="triggerImport()" style="${B}flex:1;padding:12px;font-size:13px;
            background:#FDEEE7;color:${accent}">📥 Import</button>
        </div>
      </div>

      <!-- Phone instructions -->
      <div style="border:2px solid #EDE4DA;border-radius:16px;padding:20px;margin-bottom:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">📱</span> Add to Home Screen
        </h3>
        <div style="color:#5a4a3a;font-size:13px;line-height:1.7;margin-top:8px">
          <p style="margin-bottom:6px"><strong>iPhone:</strong> Tap share ↑ → "Add to Home Screen"</p>
          <p><strong>Android:</strong> Tap ⋮ → "Add to Home screen"</p>
        </div>
      </div>

      <!-- Security -->
      <div style="border:2px solid #EDE4DA;border-radius:16px;padding:20px">
        <h3 style="font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">🔒</span> Security
        </h3>
        <p style="color:#9A8778;font-size:13px;margin-bottom:16px">
          Signed in as <strong>${esc(AUTH.username)}</strong>. Your login is checked by Google, and the copy on this device is encrypted.
        </p>
        <button onclick="signOut('Signed out.')" style="${B}width:100%;padding:12px;font-size:13px;
          background:#FDEEE7;color:${accent}">Sign out</button>
      </div>
    </div>`;
  }

  h+=`</div>`;
  app.innerHTML=h;
  if(view==='add'){const inp=document.getElementById('task-input');if(inp)inp.focus()}
}

function fi(){setTimeout(()=>{const inp=document.getElementById('task-input');if(inp)inp.focus()},10)}

// Start: show login, or sign in automatically if "keep me signed in" was used
(async function start(){
  setupLoginForm('', false);
  const saved = lsGet(REMEMBER_KEY), url = lsGet(URL_KEY);
  if (saved && url) {
    try {
      const {username, password} = JSON.parse(saved);
      document.getElementById('login-user').value = username;
      document.getElementById('lock-hint').textContent = 'Signing in…';
      await signIn(username, password, url, true);
    } catch (err) {
      lsDel(REMEMBER_KEY);
      setupLoginForm(err.message, true);
    }
  }
})();
</script>
</body>
</html>
